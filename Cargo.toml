[package]
name = "axum_gcra"
description = "GCRA-based Rate Limiter for Axum with per-route/per-key rate limiting"
authors = ["novacrazy <novacrazy@gmail.com>"]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
include = ["src/**/*", "LICENSE-*", "README.md"]
repository = "https://github.com/Lantern-chat/axum_gcra"
documentation = "https://docs.rs/axum_gcra"
keywords = ["axum", "rate-limiting", "middleware", "gcra"]
categories = ["web-programming"]

[features]
default = ["tokio", "real_ip", "itoa"]

tokio = ["dep:tokio", "axum/tokio"]
real_ip = ["tokio"]
itoa = ["dep:itoa"]

[dependencies]
tower = "0.5.3"
scc = "3.8.8"
axum = { version = "0.8.9", default-features = false, features = ["matched-path"] }
http = "1.5.0"
futures-util = "0.3.34"
pin-project-lite = "0.2.17"

tokio = { version = "1.53.3", default-features = false, features = ["rt", "sync", "time", "macros"], optional = true }
itoa = { version = "1.0.18", optional = true }
foldhash = "0.2.0"

[dev-dependencies]
axum = { version = "0.8.9", default-features = true }
rustc-hash = "2.1.3"
tokio = { version = "1.53.3", features = ["full"] }

[[example]]
name = "rate_limited"
required-features = ["real_ip"]

[[test]]
name = "throttling"
required-features = ["real_ip"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
